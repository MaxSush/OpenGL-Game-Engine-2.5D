name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [ x64-debug, x64-release ]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive          # glfw, spdlog, glm, imgui, doctest

      - uses: ilammy/msvc-dev-cmd@v1     # puts cl.exe on PATH and sets VSINSTALLDIR (the presets need both)
        with:
          arch: x64

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-${{ matrix.preset }}
          path: out/build/${{ matrix.preset }}/Testing/Temporary/LastTest.log
          if-no-files-found: ignore 